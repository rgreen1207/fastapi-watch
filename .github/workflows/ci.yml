name: CI

on:
  pull_request:

# A new push to the PR supersedes the run in progress rather than queueing behind it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }} / FastAPI ${{ matrix.fastapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Oldest supported release and the newest available.  The two straddle
        # FastAPI 0.137's switch from flat route copies to _IncludedRouter.
        fastapi: ["0.100.*", "latest"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and test dependencies
        run: pip install -e . pytest pytest-asyncio pytest-timeout httpx

      # Extras are installed one at a time: a driver without wheels for a new
      # Python (aiokafka on 3.15 at the time of writing) must not block the rest
      # of the suite.  Tests for a missing driver skip themselves.
      - name: Install optional extras
        run: |
          for extra in sqlalchemy postgres mysql redis memcached rabbitmq kafka mongo http celery; do
            pip install -e ".[$extra]" || echo "::warning::extra '$extra' failed to install on Python ${{ matrix.python-version }}; its tests will be skipped"
          done

      # Old FastAPI ships Starlette <0.28, whose TestClient passes app= to httpx,
      # which httpx 0.28 removed.  httpx is a test-only dependency.
      - name: Pin FastAPI
        if: matrix.fastapi != 'latest'
        run: pip install "fastapi==${{ matrix.fastapi }}" "httpx<0.28"

      - name: Run tests
        run: pytest
