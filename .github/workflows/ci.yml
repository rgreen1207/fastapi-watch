name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

# A new push to the same PR or ref supersedes the run in progress rather than
# queueing behind it.  Pushes have no PR number, so they group by ref; without
# that every push would share one group and cancel unrelated runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.13.3"
      - run: ruff check src tests

  test:
    name: Python ${{ matrix.python-version }} / FastAPI ${{ matrix.fastapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Pre-release Pythons report problems early without blocking the PR.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Oldest supported release and the newest available.  The two straddle
        # FastAPI 0.137's switch from flat route copies to _IncludedRouter.
        fastapi: ["0.100.*", "latest"]
        # Next Python, pre-release.  Promote into python-version (and add the
        # classifier) once it is final and this job is green.
        include:
          - python-version: "3.16"
            fastapi: "latest"
            experimental: true

    # Real Redis for the RedisProbeStorage tests (they skip without it).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FASTAPI_WATCH_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package and test dependencies
        run: pip install -e . pytest pytest-asyncio pytest-timeout httpx

      # Extras are installed one at a time: a driver without wheels for a new
      # Python (aiokafka on 3.15 at the time of writing) must not block the rest
      # of the suite.  Tests for a missing driver skip themselves.
      - name: Install optional extras
        run: |
          for extra in sqlalchemy postgres mysql redis memcached rabbitmq kafka mongo http celery; do
            pip install -e ".[$extra]" || echo "::warning::extra '$extra' failed to install on Python ${{ matrix.python-version }}; its tests will be skipped"
          done

      # Old FastAPI ships Starlette <0.28, whose TestClient passes app= to httpx,
      # which httpx 0.28 removed.  httpx is a test-only dependency.
      - name: Pin FastAPI
        if: matrix.fastapi != 'latest'
        run: pip install "fastapi==${{ matrix.fastapi }}" "httpx<0.28"

      - name: Run tests
        run: pytest
